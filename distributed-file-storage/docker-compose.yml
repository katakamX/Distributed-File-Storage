services:
  coordinator:
    build: .
    command: uvicorn app.coordinator:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    environment:
      NODES: http://node1:8000,http://node2:8000,http://node3:8000
      DATABASE: /data/metadata.db
    volumes: ["metadata:/data"]
    depends_on: [node1, node2, node3]
  node1:
    build: .
    command: uvicorn app.node:app --host 0.0.0.0 --port 8000
    environment: {STORAGE_DIR: /data}
    volumes: ["node1:/data"]
  node2:
    build: .
    command: uvicorn app.node:app --host 0.0.0.0 --port 8000
    environment: {STORAGE_DIR: /data}
    volumes: ["node2:/data"]
  node3:
    build: .
    command: uvicorn app.node:app --host 0.0.0.0 --port 8000
    environment: {STORAGE_DIR: /data}
    volumes: ["node3:/data"]
volumes:
  metadata:
  node1:
  node2:
  node3:
